<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />

    <!-- SEO -->
    <title>Aashutosh Kumar Singh — Software Developer</title>
    <meta name="description" content="Portfolio of Aashutosh Kumar Singh. Third-Year CS Student, Former Software Development Intern at Indori Coders, and Freelance Full-Stack Developer specializing in React, React Native, and Node.js." />
    <meta name="author" content="Aashutosh Kumar Singh" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aashu2252.github.io/Portfolio/" />
    <meta property="og:title" content="Aashutosh Kumar Singh — Software Developer" />
    <meta property="og:description" content="Third-Year CS Student, Former Intern @ Indori Coders & Freelance Full-Stack Developer specializing in React, React Native, and Node.js." />
    <meta property="og:image" content="https://aashu2252.github.io/Portfolio/og-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aashutosh Kumar Singh — Software Developer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Prevent flash of wrong theme -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#fafafa] dark:bg-[#0f0f10] text-zinc-900 dark:text-zinc-50 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
