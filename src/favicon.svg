<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow Background -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)" opacity="0.6"/>
  <!-- Floating Triangle -->
  <polygon points="50,25 80,75 20,75" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="50,38 70,70 30,70" fill="#00f2fe" opacity="0.8"/>
</svg>
